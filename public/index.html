    <script>
      // Xerife: sonda se existe backend /api (Express local ou Cloudflare Pages Functions).
      // Define window.__XERIFE_PROXY__ antes do bundle carregar (deploy estático -> false).
      (function () {
        try {
          var ctl = new AbortController();
          var to = setTimeout(function () { ctl.abort(); }, 2500);
          fetch('/api/status', { signal: ctl.signal, cache: 'no-store' })
            .then(function (r) {
              var ct = (r.headers.get('content-type') || '');
              return ct.indexOf('json') >= 0 ? r.json() : null;
            })
            .then(function (j) { clearTimeout(to); window.__XERIFE_PROXY__ = !!(j && j.app === 'Xerife Player'); })
            .catch(function () { clearTimeout(to); window.__XERIFE_PROXY__ = false; });
        } catch (e) { window.__XERIFE_PROXY__ = false; }
      })();
    </script>
